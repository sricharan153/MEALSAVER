<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Waste Management Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('https://c4.wallpaperflare.com/wallpaper/495/760/53/cuisine-food-india-indian-wallpaper-preview.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f1f1f1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
        }

        .content {
            background-color: rgba(255, 255, 255, 0.8); /* Semi-transparent white */
            padding: 20px;
            text-align: center;
        }

        .logo img {
            max-width: 100px;
            height: auto;
        }

        /* Buttons */
        .but1, .but2 {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease; /* Animation for smooth hover */
        }

        .but1 {
            background-color: green;
            color: #fff;
        }

        .but1:hover {
            background-color: #28a745;
            transform: scale(1.1); /* Slight zoom effect on hover */
        }

        .but2 {
            background-color: red;
            color: #fff;
        }

        .but2:hover {
            background-color: #dc3545;
            transform: scale(1.1); /* Slight zoom effect on hover */
        }

        .cen {
            text-align: center;
            margin-top: 20px;
        }

        /* Sidebar */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1;
            top: 0;
            left: 0;
            background-color: #111;
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
        }

        .sidebar a {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 25px;
            color: #818181;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            color: #f1f1f1;
        }

        .sidebar .closebtn {
            position: absolute;
            top: 0;
            right: 25px;
            font-size: 36px;
            margin-left: 50px;
        }

        #main {
            transition: margin-left .5s;
            padding: 16px;
        }

        .openbtn {
            font-size: 20px;
            cursor: pointer;
            background-color: #111;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
        }

        /* Adjustments for smaller screens */
        @media screen and (max-height: 450px) {
            .sidebar {padding-top: 15px;}
            .sidebar a {font-size: 18px;}
        }

        /* Animation for fading in and sliding up */
        .fade-in {
            animation: fadeInUp 0.5s ease-in-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translate3d(0, 20px, 0);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div id="sidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="#">My details</a>
        <a href="dona.html">Donors details</a>
        <a href="">Agent Details</a>
        <a href="#">Food collecting Details</a>
        <a href="#">Orphanage Details</a>
        <a href="#">Contact</a>
    </div>

    <div id="main">
        <button class="openbtn fade-in" onclick="openNav()">☰ AGENTS ACCOUNT</button>
    </div>

    <div class="menu-icon">☰</div>

    <div class="cen fade-in">
        <h1>NOTIFICATION FROM ADMIN</h1>
        <button class="but1" onclick="window.location.href='dona.html'">Click Here</button>
        <button class="but2" onclick="window.location.href='Main.html'">Logout</button>
        <button class="but1" onclick="window.location.href='a.html'">Location Detail</button>
    </div>

    <script>
        function openNav() {
            document.getElementById("sidebar").style.width = "250px";
            document.getElementById("main").style.marginLeft = "250px";
        }

        function closeNav() {
            document.getElementById("sidebar").style.width = "0";
            document.getElementById("main").style.marginLeft = "0";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
