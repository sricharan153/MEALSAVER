<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Waste Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header img {
            max-width: 100px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-right: 1rem;
        }

        .hero {
            background-image: url('https://img.freepik.com/free-photo/top-view-food-frame-with-copy-space_23-2148723447.jpg');
            background-size: cover;
            color: #fff;
            text-align: center;
            height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hero p {
            font-size: 1.5rem;
            color: #f0db4f;
            font-weight: bold;
            opacity: 0.9;
        }

        .cta-button {
            display: inline-block;
            text-align: center;
            background-color: #ff6347;
            width: 150px;
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 1rem;
            transition: background-color 0.3s ease;
        }

        .cta-button:hover {
            background-color: #e74c3c;
        }

        .user-options {
            display: flex;
            justify-content: center;
            margin-top: 1rem; /* Move it closer to Get Started button */
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .user-options button {
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 1.2rem 2.5rem; /* Increased size */
            margin: 0 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
            opacity: 0;
            transform: scale(0.5) translateY(30px);
        }

        .user-options button:hover {
            background-color: #2980b9;
        }

        /* Keyframe animation for zoom-in and slide-up effect */
        @keyframes zoomInUp {
            0% {
                opacity: 0;
                transform: scale(0.5) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .user-options.show button {
            animation: zoomInUp 0.5s ease forwards;
        }

        .user-options.show button:nth-child(1) {
            animation-delay: 0.2s;
        }

        .user-options.show button:nth-child(2) {
            animation-delay: 0.4s;
        }

        .xx {
            height: 65px;
            width: 80px;
        }

        /* Animation for CTA button */
        .cta-button {
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .cta-button:hover {
            transform: scale(1.05);
        }
        .lll{
            font-size: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="Food Waste Management Logo" class="xx">
        <nav class="lll">
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="CONTACT.html">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>MEAL SAVER</h1>
        <p>Your solution for sustainable food management</p>
        <a href="#" class="cta-button" onclick="showUserOptions()">Get Started</a>

        <section class="user-options" id="user-options">
            <button onclick="window.location.href='donor-login.html'">Donor</button>
            <button onclick="window.location.href='agent-login.html'">Agent</button>
        </section>
    </section>

    <script>
        function showUserOptions() {
            var userOptions = document.getElementById('user-options');
            userOptions.classList.add('show');
            userOptions.style.opacity = 1;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
