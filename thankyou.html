<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Successful</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #c3cfe2 0%, #f5f7fa 100%);
        }

        .message-container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .message-container h2 {
            font-size: 28px;
            color: #28a745;
            margin-bottom: 20px;
        }

        .message-container p {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }

        .message-container button {
            padding: 10px 20px;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .message-container button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="message-container">
        <h2>Thank You for Your Generous Donation!</h2>
        <p>Your donation has been successfully submitted.</p>
        <button onclick="goHome()">Return to Home</button>
    </div>

    <script>
        function goHome() {
            window.location.href = 'donor.html'; // Adjust the URL to your home page
        }
    </script>
</body>
</html>
