<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Waste Management Admin Dashboard</title>
    <style>
        .body {
            font-family: Arial, sans-serif;
            background-image: url('https://img.freepik.com/premium-photo/vibrant-assortment-traditional-indian-cuisine-delights_388444-117842.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            height: 100vh;
            backdrop-filter: blur(5px); 
        }
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1;
            top: 0;
            left: 0;
            background-color: #2c3e50;
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
        }

        .sidebar a {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 25px;
            color: #ecf0f1;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            color: #f39c12;
        }
        .sidebar .closebtn {
            position: absolute;
            top: 0;
            right: 25px;
            font-size: 36px;
            margin-left: 50px;
        }
        #main {
            transition: margin-left .5s;
            padding: 16px;
        }

        .openbtn {
            font-size: 20px;
            cursor: pointer;
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .openbtn:hover {
            background-color: #c0392b;
        }

        .bt1 {
            background-color: green;
        }

        .bt2 {
            background-color: red;
        }

        .css {
            text-align: center;
        }

        /* Body styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #ecf0f1;
        }

        /* Container styling */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding-top: 20px;
        }

        /* Block styling */
        .block {
            background: linear-gradient(135deg, #3498db, #9b59b6);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
            width: 200px; 
            text-decoration: none;
            color: white;
        }

        .block:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .block h3 {
            margin-top: 0;
            font-size: 24px;
        }

        .block p {
            color: #f1f1f1;
        }

        .css p {
            font-size: 18px;
            color: #333;
        }

        .css button {
            background-color: #e74c3c;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .css button:hover {
            background-color: #c0392b;
        }

        /* Notification button styling */
        .notification-btn {
            background-color: #e67e22;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 20px;
        }

        .notification-btn:hover {
            background-color: #d35400;
        }

        /* Modal styling for displaying agent details */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 10px;
            text-align: center;
        }

        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close-btn:hover, .close-btn:focus {
            color: black;
            cursor: pointer;
        }

        /* Button for Click Here and Logout */
        .action-btn {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            margin-right: 10px;
            transition: background-color 0.3s;
        }

        .action-btn:hover {
            background-color: #2980b9;
        }

        /* Adjustments for smaller screens */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 10px;
            }

            .block {
                width: 90%;
            }
        }
    </style>
</head>
<body class="body">
    <div id="sidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="#">My Account</a>
        <a href="Main.html">My Home Page</a>
        <a href="OURMISSION.html">Our Mission</a>
        <a href="about.html">About Us</a>
        <a href="#">Contact Admin</a>
    </div>

    <div id="main">
        <button class="openbtn" onclick="openNav()">☰ Donor Account</button>

        <div class="container">
            <a href="home.html" class="block">
                <h3>Home</h3>
            </a>
            <a href="check.html" class="block">
                <h3>My Donations</h3>
            </a>
            <a href="donatenowform.html" class="block">
                <h3>Donate Now</h3>
            </a>
        </div>

        <!-- New Notification Section -->
        <div class="css">
            <p style="color:#ecf0f1">Notification from agent</p>
            <div>
                <button class="notification-btn" id="notificationBtn">View Agent Details</button>
            </div>
        </div>

        <!-- Modal for displaying agent details -->
        <div id="agentModal" class="modal">
            <div class="modal-content">
                <span class="close-btn" id="closeModal">&times;</span>
                <h3>Agent Details</h3>
                <p id="agentName"></p>
                <p id="agentEmail"></p>
                <p id="agentMobile"></p>
            </div>
        </div>

        <!-- Click Here and Logout buttons -->
        <div style="text-align: center; margin-top: 30px;">
            <button class="action-btn" onclick="location.href='agent-login1.html'">Click Here</button>
            <button class="action-btn" onclick="logout()">Logout</button>
        </div>

    </div>

    <script>
        /* Open the sidebar */
        function openNav() {
            document.getElementById("sidebar").style.width = "250px";
            document.getElementById("main").style.marginLeft = "250px";
        }

        /* Close the sidebar */
        function closeNav() {
            document.getElementById("sidebar").style.width = "0";
            document.getElementById("main").style.marginLeft = "0";
        }

        // Notification button logic
        document.getElementById('notificationBtn').addEventListener('click', function() {
            // Fetch agent details from localStorage
            const agentName = localStorage.getItem('agentName') || 'N/A';
            const agentEmail = localStorage.getItem('agentEmail') || 'N/A';
            const agentMobile = localStorage.getItem('agentMobile') || 'N/A';

            // Display agent details in the modal
            document.getElementById('agentName').textContent = `Name: ${agentName}`;
            document.getElementById('agentEmail').textContent = `Email: ${agentEmail}`;
            document.getElementById('agentMobile').textContent = `Mobile: ${agentMobile}`;

            // Show modal
            document.getElementById('agentModal').style.display = 'block';
        });

        // Close modal
        document.getElementById('closeModal').addEventListener('click', function() {
            document.getElementById('agentModal').style.display = 'none';
        });

        // Logout functionality
        function logout() {
            // Clear local storage
            localStorage.clear();
            alert("You have logged out.");
            window.location.href = "Main.html";
        }
    </script>
</body>
</html>
