<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous"/>
    <style>
        body {
            background-color: #f0f8ff; /* Light blue background */
            font-family: 'Arial', sans-serif;
            color: #333;
            padding: 30px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
        }
        .cl {
            text-align: center;
            border-radius: 10px;
            margin-right: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .content h2 {
            color: #5d1049; /* Rich purple for headings */
            margin-bottom: 20px;
        }
        .content h2:first-of-type {
            color: #ff6f61; /* Bright orange for the first heading */
        }
        .content p {
            font-size: 18px;
            color: #4a4a4a;
            line-height: 1.6;
        }
        .btn-donate {
            background-color: #ff6f61;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-donate:hover {
            background-color: #d64b42;
        }
    </style>
</head>
<body>
    <div class="container d-flex align-items-center">
        <img src="https://m.media-amazon.com/images/I/71fvEk4vmnL._SY466_.jpg" class="cl" alt="Helping Hand" width="300">
        <div class="content">
            <h2>Helping the Needy</h2>
            <h2>India faces a crisis where 1000+ people go to bed hungry every night. Starvation and malnutrition are rampant.</h2>
            <h2>We aim to eradicate hunger and provide sustainable food solutions for the needy.</h2>
            <button class="btn-donate mt-3" Onclick="button()">Donate Now</button>
        </div>
    </div>
    
    
    
</body>
<script>
    function button(){
        window.location.href = 'Main.html';
    }

    
</script>
</html>
