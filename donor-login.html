<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OIL AGENCY</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('https://img.freepik.com/premium-photo/vibrant-assortment-traditional-indian-cuisine-delights_388444-117842.jpg'); /* Add your image here */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            backdrop-filter: blur(5px); /* Optional: adds a blur effect to the background */
        }
        .login-container {
            background-color: rgba(255, 255, 255, 0.8); /* Semi-transparent white */
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            padding: 2rem;
            width: 300px;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.5rem;
            border-radius: 3px;
            border: 1px solid #ccc;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 3px;
            padding: 0.8rem;
            width: 100%;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        .switch-link {
            text-align: center;
            margin-top: 1rem;
        }

        .switch-link a {
            color: #007bff;
            text-decoration: none;
        }

        .but {
            background-color: #45a049;
            height: 40px;
            width: 100%;
            border-radius: 10px;
            color: #fff;
            text-align: center;
            line-height: 40px;
            cursor: pointer;
            border: none;
        }

        .error-message {
            color: red;
            text-align: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>DONOR LOGIN</h2>
        <form id="loginForm" onsubmit="return validateForm()">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group cc">
                <button type="button" class="but" onclick="redirectToForm()">Register</button>
            </div>
            <div class="error-message" id="error-message"></div>
        </form>
    </div>

    <script>
        function redirectToForm() {
            // Prevent form submission
            event.preventDefault();
            
            const name = document.getElementById('name').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');

            if (name === '' || password === '') {
                errorMessage.textContent = 'Please fill out all details.';
            } else {
                errorMessage.textContent = ''; // Clear error message
                window.location.href = 'donor.html';
            }
        }

        function validateForm() {
            // Return false to prevent form submission for the example
            return false;
        }
    </script>
</body>
</html>
