<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Supermarkets</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCJLIQ3QXkvsdLQ_jeyULZeJsj4f5Zi0EE&libraries=places"></script>
    <style>
        /* Style for the map */
        #map {
            height: 500px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        /* Center the content */
        .container {
            max-width: 600px;
            margin: 50px auto;
            text-align: center;
        }

        h1 {
            font-family: Arial, sans-serif;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Top 10 Supermarkets Near You</h1>
        <div id="map"></div>
    </div>

    <script>
        let map, placesService;

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 15,
                center: { lat: 0, lng: 0 },
            });

            // Use the browser's geolocation to get the user's position
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const userLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                        };

                        map.setCenter(userLocation);
                        showNearbySupermarkets(userLocation);
                    },
                    () => alert("Geolocation failed. Please allow location access.")
                );
            } else {
                alert("Your browser doesn't support Geolocation.");
            }
        }

        function showNearbySupermarkets(location) {
            const request = {
                location: location,
                radius: 5000, // Search within 5 km
                type: ["supermarket"],
            };

            placesService = new google.maps.places.PlacesService(map);
            placesService.nearbySearch(request, (results, status) => {
                if (status === google.maps.places.PlacesServiceStatus.OK) {
                    results.slice(0, 10).forEach((place) => {
                        const marker = new google.maps.Marker({
                            map: map,
                            position: place.geometry.location,
                            title: place.name,
                        });

                        const infoWindow = new google.maps.InfoWindow({
                            content: `<div><strong>${place.name}</strong><br>${place.vicinity}</div>`,
                        });

                        marker.addListener("click", () => {
                            infoWindow.open(map, marker);
                        });
                    });
                } else {
                    console.error("Failed to find places:", status);
                }
            });
        }

        window.onload = initMap;
    </script>
</body>
</html>
